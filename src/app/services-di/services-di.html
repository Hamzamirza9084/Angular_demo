<h2>Angular Services & Dependency Injection (HttpClient)</h2>

<h3>1. Create New Post (HTTP POST)</h3>
<div>
  <div>
    <label>Title:</label>
    <input type="text" [(ngModel)]="newTitle" placeholder="Enter post title" />
  </div>

  <div>
    <label>Body:</label>
    <input type="text" [(ngModel)]="newBody" placeholder="Enter post body" />
  </div>

  <button (click)="onSubmitPost()" [disabled]="isSubmitting">
    {{ isSubmitting ? 'Submitting...' : 'Submit Post' }}
  </button>
</div>

<p *ngIf="successMessage" style="color: green; font-weight: bold; margin-top: 10px;">
  {{ successMessage }}
</p>
<p *ngIf="errorMessage" style="color: red; font-weight: bold; margin-top: 10px;">
  {{ errorMessage }}
</p>

<hr />

<h3>2. Posts List from REST API (HTTP GET)</h3>

<div style="margin-bottom: 15px;">
  <button (click)="fetchPosts()" [disabled]="isLoading" style="margin-right: 10px;">
    {{ isLoading ? 'Loading...' : 'Refresh Posts' }}
  </button>
  <button (click)="clearList()" [disabled]="posts.length === 0">
    Clear List
  </button>
</div>

<p *ngIf="isLoading">Loading data from REST API...</p>

<table border="1" cellpadding="8" *ngIf="!isLoading && posts.length > 0">
  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Body</th>
    <th>Action</th>
  </tr>
  <tr *ngFor="let post of posts">
    <td>{{ post.id }}</td>
    <td>{{ post.title }}</td>
    <td>{{ post.body }}</td>
    <td>
      <button (click)="deletePost(post.id)" [disabled]="deletingId === post.id">
        {{ deletingId === post.id ? 'Deleting...' : 'Delete' }}
      </button>
    </td>
  </tr>
</table>

<p *ngIf="!isLoading && posts.length === 0">No posts to display.</p>
